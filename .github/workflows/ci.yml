name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: test and build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run verify
      - run: npm test
      - run: npm run build

      - name: Verify the packed file list
        run: |
          tar -tzf dist/*.tgz | sort
          tar -tzf dist/*.tgz | grep -q 'package/index.js'
          tar -tzf dist/*.tgz | grep -q 'package/cordis.patch.yml'
          tar -tzf dist/*.tgz | grep -q 'package/locale/zh.json'
          tar -tzf dist/*.tgz | grep -q 'package/icon.svg'
          tar -tzf dist/*.tgz | grep -q 'package/client.js'
          tar -tzf dist/*.tgz | grep -q 'package/lib/http.js'
          tar -tzf dist/*.tgz | grep -q 'package/lib/token-store.js'

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-workbuddy-node${{ matrix.node }}
          path: |
            dist/*.tgz
            dist/*.sha256
          if-no-files-found: error
